<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Primary 'A' Gradient Left -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Accent 'A' Gradient Right -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Core Crossbar Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#ambientGlow)" />

  <!-- Monogram Graphic: Futuristic 'A' with Analytics Nodes -->
  <g filter="url(#glow)">
    <!-- Apex Node -->
    <circle cx="256" cy="116" r="18" fill="#38bdf8" />
    <circle cx="256" cy="116" r="8" fill="#ffffff" />

    <!-- Left Geometric Pillar -->
    <path d="M256 132 L150 380 H210 L256 254 L276 304 H216 L234 254 Z" fill="url(#primaryGrad)" />
    
    <!-- Right Geometric Pillar -->
    <path d="M256 132 L362 380 H302 L276 304 L294 254 H328 Z" fill="url(#accentGrad)" />

    <!-- Futuristic Tech Crossbar -->
    <rect x="180" y="286" width="152" height="24" rx="12" fill="url(#coreGrad)" />
    
    <!-- Data Analytics Nodes -->
    <circle cx="214" cy="298" r="6" fill="#ffffff" />
    <circle cx="256" cy="298" r="6" fill="#ffffff" />
    <circle cx="298" cy="298" r="6" fill="#ffffff" />
  </g>
</svg>
